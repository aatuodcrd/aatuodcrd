name: activity graph
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/activity_graph.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/activity-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh activity graph"
          git push
